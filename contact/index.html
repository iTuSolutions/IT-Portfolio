<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | iT-U Company</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="../index.html" class="logo">iT-U Company</a>
      <button class="mobile-menu-btn">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../about/index.html">About</a></li>
        <li><a href="../services/index.html">Services</a></li>
        <li><a href="../solutions/index.html">Solutions</a></li>
        <li><a href="index.html" class="active">Contact</a></li>
        <li><button class="theme-toggle">☀️ Light Mode</button></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 600px;">
    <h2 class="section-title">Get in Touch</h2>
    <p class="section-subtitle">Reach out for business inquiries or enterprise support desk assistance.</p>
    
    <div class="card">
      <form>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email5" id="email" class="form-control" placeholder="name@company.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message / Support Request</label>
          <textarea id="message" class="form-control" placeholder="Describe your IT infrastructure requirements..." required></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Send Inquiry</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 iT-U Company. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
